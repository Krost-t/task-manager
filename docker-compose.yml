# ==========================================================
#  Task Manager - local / CI stack (images are BUILT from source)
#
#  create a .env next to this file (see README)
#  docker compose up -d --build
#  -> http://localhost:8080 (APP_PORT)
# ==========================================================

services:
  # ---------- Database ----------
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # Localhost only: lets `npm run dev` (backend/) or Compass reach the DB
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- REST API (Express) ----------
  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-task-manager-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8000
      CLIENT_URL: ${APP_URL}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-task-manager}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN:-7}
      ADMIN_INVITE_TOKEN: ${ADMIN_INVITE_TOKEN}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  # ---------- Frontend (React build served by nginx) ----------
  frontend:
    build:
      context: ./frontend
    image: ${FRONTEND_IMAGE:-task-manager-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
