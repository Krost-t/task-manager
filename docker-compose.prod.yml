# ==========================================================
#  Task Manager - production stack (images are PULLED from GHCR)
#
#  Used on the server by the CD pipeline:
#    IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml pull
#    IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml up -d
#  The server only needs this file + a .env file next to it.
# ==========================================================

services:
  mongo:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    restart: always
    environment:
      PORT: 8000
      CLIENT_URL: ${APP_URL}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-task-manager}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN:-7}
      ADMIN_INVITE_TOKEN: ${ADMIN_INVITE_TOKEN}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
